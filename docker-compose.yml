services:
  db:
    image: pgvector/pgvector:pg17-trixie
    container_name: scrapecat-db
    environment:
      POSTGRES_USER: scrapecat
      POSTGRES_PASSWORD: scrapecat
      POSTGRES_DB: scrapecat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapecat -d scrapecat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-dev:
    container_name: scrapecat-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/.next
      - repo_archives:/app/repos
    env_file:
      - backend/.env
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgres://scrapecat:scrapecat@db:5432/scrapecat
      - REPO_ARCHIVE_DIR=/app/repos
    depends_on:
      db:
        condition: service_healthy

  frontend-dev:
    container_name: scrapecat-ui
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend-dev

volumes:
  postgres_data:
  repo_archives:
